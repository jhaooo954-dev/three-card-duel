<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152720"><title>双人五子棋</title><link rel="stylesheet" href="style.css?v=1"><script src="app.js?v=1" defer></script></head><body><main>
<header><div><span class="eyebrow">FIVE IN A ROW</span><h1>双人五子棋</h1></div><span id="round">等待开局</span></header>
<div class="players"><div id="seat0"><i></i><b id="name0">房主</b><small id="score0">0 胜</small></div><span>VS</span><div id="seat1"><i></i><b id="name1">好友</b><small id="score1">0 胜</small></div></div>
<section class="status" aria-live="polite"><h2 id="title">正在连接棋局…</h2><p id="subtitle">同一房间 · 双方实时同步</p></section>
<div class="board-wrap"><div id="board" class="board" role="group" aria-label="15乘15五子棋棋盘"></div></div>
<button id="start" class="gold" disabled>等待连接</button><p id="notice" role="status" aria-live="polite"></p>
<details><summary>玩法说明</summary><p>首局房主执黑先走，双方轮流在交点落子，横、竖或斜线连成五子即获胜（长连也获胜，无禁手）。</p><p>赢家下一局执黑先落子；平局保持本局先手。回大厅再进入，棋盘与胜场都会保留。断线后可回到原房间继续。</p></details><footer>好友对弈 · 赢家先手</footer></main></body></html>
