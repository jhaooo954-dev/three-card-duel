<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a211a"><title>好友游戏厅 · 统一房间</title><link rel="stylesheet" href="/club/style.css?v=5"><script src="/club/app.js?v=5" defer></script></head><body><main>
<header><div class="brand"><b>♠⚄</b><span>好友游戏厅<small>ONE ROOM · FOUR GAMES</small></span></div><button id="back" hidden>回大厅</button></header>
<section id="entry"><div class="eyebrow">一个房间，四种玩法</div><h1>只输一次码，<br><em>想玩哪个就玩哪个。</em></h1><p class="sub">炸金花 · 大话骰 · 十点半 · 五子棋<br>可选双人或三人，同一个房间一起切换游戏。</p><label for="nickname">你的昵称</label><input id="nickname" maxlength="12" placeholder="取个昵称"><label for="player-count">房间人数</label><select id="player-count" aria-label="创建房间人数"><option value="2">双人模式 · 2人</option><option value="3">三人模式 · 3人</option></select><button class="gold wide" id="create">创建统一房间</button><div class="divider">或加入好友的房间</div><div class="join"><input id="code" inputmode="numeric" maxlength="6" placeholder="6位房间码" aria-label="房间码"><button id="join">加入</button></div><p class="tiny sub">只在这里输入一次，游戏里无需再次建房或输码。</p><div class="downloads"><a href="/club.apk">下载新版APK</a><a href="/club.zip">ZIP压缩包</a></div></section>
<div id="room-bar" class="room" hidden><div><small id="connection">正在连接</small><strong id="roomcode"></strong></div><button id="copy">复制房间码</button></div>
<section id="lobby" hidden><div class="lobby-title"><div><span class="eyebrow">同一房间，一起切换</span><h2>这一局，玩什么？</h2></div><span id="players"></span></div><div class="mode-row"><label for="room-mode">房间人数</label><select id="room-mode" aria-label="切换房间人数"><option value="2">双人模式 · 2人</option><option value="3">三人模式 · 3人</option></select><small id="mode-hint">开局前由房主选择</small></div><p id="lobby-hint" class="sub">等待好友加入…</p>
<button class="game-card" id="pick-card"><span class="game-icon">♠</span><span class="game-text"><b>炸金花</b><small>闷牌、看牌、加注和开牌</small><em id="summary-card">进入游戏</em></span><span>↗</span></button>
<button class="game-card" id="pick-dice"><span class="game-icon">⚄</span><span class="game-text"><b>大话骰</b><small>自己喊数，任意一人开盅</small><em id="summary-dice">进入游戏</em></span><span>↗</span></button>
<button class="game-card" id="pick-tenhalf"><span class="game-icon compact">10½</span><span class="game-text"><b>十点半</b><small>整铺换庄，自动翻牌与倍数结算</small><em id="summary-tenhalf">进入游戏</em></span><span>↗</span></button>
<button class="game-card" id="pick-gomoku"><span class="game-icon">●</span><span class="game-text"><b>双人五子棋</b><small>十五路棋盘 · 五子连珠 · 赢家下局先落子</small><em id="summary-gomoku">进入游戏</em></span><span>↗</span></button>
<p class="tiny sub">任意一方选游戏，全员会一起进入。<br>回大厅不退出房间，各游戏的牌局和积分分别保留。</p><button class="wide" id="leave">退出这个房间</button></section>
<section id="play" hidden><iframe id="game-frame" title="当前游戏" allow="clipboard-write" referrerpolicy="no-referrer"></iframe></section>
<div id="notice" role="status" aria-live="polite"></div><footer id="footer">好友休闲游戏 · 虚拟积分无现金价值 · 统一房间版 v2.2</footer>
</main></body></html>
