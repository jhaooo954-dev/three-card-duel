<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a211a"><title>双人游戏厅 · 统一房间</title><link rel="stylesheet" href="/club/style.css?v=2"><script src="/club/app.js?v=2" defer></script></head><body><main>
<header><div class="brand"><b>♠⚄</b><span>双人游戏厅<small>ONE ROOM · THREE GAMES</small></span></div><button id="back" hidden>回大厅</button></header>
<section id="entry"><div class="eyebrow">一个房间，三种玩法</div><h1>只输一次码，<br><em>想玩哪个就玩哪个。</em></h1><p class="sub">炸金花 · 大话骰 · 十点半<br>两个人进一个房间，就能一起切换全部游戏。</p><label for="nickname">你的昵称</label><input id="nickname" maxlength="12" placeholder="取个昵称"><button class="gold wide" id="create">创建统一房间</button><div class="divider">或加入好友的房间</div><div class="join"><input id="code" inputmode="numeric" maxlength="6" placeholder="6位房间码" aria-label="房间码"><button id="join">加入</button></div><p class="tiny sub">只在这里输入一次，游戏里无需再次建房或输码。</p><div class="downloads"><a href="/club.apk">下载新版APK</a><a href="/club.zip">ZIP压缩包</a></div></section>
<div id="room-bar" class="room" hidden><div><small id="connection">正在连接</small><strong id="roomcode"></strong></div><button id="copy">复制房间码</button></div>
<section id="lobby" hidden><div class="lobby-title"><div><span class="eyebrow">同一房间，一起切换</span><h2>这一局，玩什么？</h2></div><span id="players"></span></div><p id="lobby-hint" class="sub">等待好友加入…</p>
<button class="game-card" id="pick-card"><span class="game-icon">♠</span><span class="game-text"><b>炸金花</b><small>闷牌、看牌、加注和开牌</small><em id="summary-card">进入游戏</em></span><span>↗</span></button>
<button class="game-card" id="pick-dice"><span class="game-icon">⚄</span><span class="game-text"><b>大话骰</b><small>自己喊数，任意一方开盅</small><em id="summary-dice">进入游戏</em></span><span>↗</span></button>
<button class="game-card" id="pick-tenhalf"><span class="game-icon compact">10½</span><span class="game-text"><b>十点半</b><small>整铺换庄，自动翻牌与倍数结算</small><em id="summary-tenhalf">进入游戏</em></span><span>↗</span></button>
<p class="tiny sub">任意一方选游戏，两个人会一起进入。<br>回大厅不退出房间，各游戏的牌局和积分分别保留。</p><button class="wide" id="leave">退出这个房间</button></section>
<section id="play" hidden><iframe id="game-frame" title="当前游戏" allow="clipboard-write" referrerpolicy="no-referrer"></iframe></section>
<div id="notice" role="status" aria-live="polite"></div><footer id="footer">好友休闲游戏 · 虚拟积分无现金价值 · 统一房间版 v2.0</footer>
</main></body></html>
